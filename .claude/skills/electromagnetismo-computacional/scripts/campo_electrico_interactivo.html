<!--
Plantilla: simulación interactiva del campo eléctrico de cargas puntuales.

Física: superposición de la ley de Coulomb (ver references/ecuaciones_maxwell.md).
Cada carga q en posición (cx,cy) contribuye al campo en (x,y) con:
    E = k * q * (r_vec / |r_vec|^3)      [forma vectorial, k = 1/(4*pi*eps0)]
El campo total en cualquier punto es la suma vectorial de todas las cargas.

Este es un archivo de referencia pensado para copiarse dentro de una llamada
a visualize:show_widget (modo HTML) o para usarse standalone. Las cargas se
pueden arrastrar con el mouse; el campo (flechas) y las líneas de campo se
recalculan en cada frame. Adapta el número de cargas, sus signos, y si
quieres mostrar líneas de campo, mapa de potencial, o ambos, según lo que
pida el usuario.
-->
<div id="em-sim-container" style="width:100%; max-width:700px; margin:0 auto; font-family: system-ui, sans-serif;">
  <canvas id="em-canvas" width="700" height="500" style="width:100%; background:#0b1020; border-radius:8px; cursor:grab;"></canvas>
  <p style="color:#9aa5b1; font-size:13px; margin-top:8px;">
    Arrastra las cargas (rojo = positiva, azul = negativa). Las flechas muestran la dirección y magnitud relativa del campo eléctrico en cada punto de la malla.
  </p>
</div>

<script>
(function () {
  const canvas = document.getElementById("em-canvas");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // k = 1/(4*pi*eps0) en unidades arbitrarias normalizadas para que se vea bien en pantalla
  const K = 5000;

  // Estado: lista de cargas. Cada una: {x, y, q} (q en unidades arbitrarias, puede ser +/-)
  let cargas = [
    { x: 250, y: 250, q: 1 },
    { x: 450, y: 250, q: -1 },
  ];

  let arrastrando = null;

  function campoEn(x, y) {
    let Ex = 0, Ey = 0;
    for (const c of cargas) {
      const dx = x - c.x, dy = y - c.y;
      const r2 = dx * dx + dy * dy;
      if (r2 < 100) continue; // evita singularidad muy cerca de la carga
      const r = Math.sqrt(r2);
      const factor = (K * c.q) / (r2 * r); // k*q / r^3, para luego multiplicar por (dx,dy)
      Ex += factor * dx;
      Ey += factor * dy;
    }
    return [Ex, Ey];
  }

  function dibujar() {
    ctx.clearRect(0, 0, W, H);

    // Malla de flechas de campo
    const paso = 40;
    for (let x = paso / 2; x < W; x += paso) {
      for (let y = paso / 2; y < H; y += paso) {
        const [Ex, Ey] = campoEn(x, y);
        const mag = Math.hypot(Ex, Ey);
        if (mag < 1e-6) continue;
        const escala = Math.min(16, Math.log10(mag + 1) * 6);
        const ux = (Ex / mag) * escala, uy = (Ey / mag) * escala;

        ctx.strokeStyle = `rgba(120, 170, 255, ${Math.min(0.9, 0.25 + escala / 20)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - ux, y - uy);
        ctx.lineTo(x + ux, y + uy);
        ctx.stroke();

        // punta de flecha simple
        const ang = Math.atan2(uy, ux);
        ctx.beginPath();
        ctx.moveTo(x + ux, y + uy);
        ctx.lineTo(x + ux - 4 * Math.cos(ang - 0.4), y + uy - 4 * Math.sin(ang - 0.4));
        ctx.lineTo(x + ux - 4 * Math.cos(ang + 0.4), y + uy - 4 * Math.sin(ang + 0.4));
        ctx.closePath();
        ctx.fillStyle = `rgba(120, 170, 255, 0.8)`;
        ctx.fill();
      }
    }

    // Cargas
    for (const c of cargas) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
      ctx.fillStyle = c.q > 0 ? "#ef4444" : "#3b82f6";
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 16px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(c.q > 0 ? "+" : "−", c.x, c.y + 1);
    }
  }

  function pos(evt) {
    const rect = canvas.getBoundingClientRect();
    const escalaX = W / rect.width, escalaY = H / rect.height;
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return { x: (clientX - rect.left) * escalaX, y: (clientY - rect.top) * escalaY };
  }

  function iniciarArrastre(evt) {
    const p = pos(evt);
    for (const c of cargas) {
      if (Math.hypot(p.x - c.x, p.y - c.y) < 18) {
        arrastrando = c;
        canvas.style.cursor = "grabbing";
        break;
      }
    }
  }

  function mover(evt) {
    if (!arrastrando) return;
    const p = pos(evt);
    arrastrando.x = Math.max(20, Math.min(W - 20, p.x));
    arrastrando.y = Math.max(20, Math.min(H - 20, p.y));
    dibujar();
  }

  function soltar() {
    arrastrando = null;
    canvas.style.cursor = "grab";
  }

  canvas.addEventListener("mousedown", iniciarArrastre);
  canvas.addEventListener("mousemove", mover);
  window.addEventListener("mouseup", soltar);
  canvas.addEventListener("touchstart", iniciarArrastre);
  canvas.addEventListener("touchmove", mover);
  window.addEventListener("touchend", soltar);

  dibujar();
})();
</script>
